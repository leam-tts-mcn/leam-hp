(function () {
  var TO = 'info@leam.co.jp';
  function val(f, n) { var e = f.querySelector('[name="' + n + '"]'); return e ? String(e.value || '').trim() : ''; }
  function send(f) {
    var ln = val(f, 'last name'), fn = val(f, 'first name'), em = val(f, 'Email');
    var ok = f.querySelector('[name="Confirm"]');
    if (!ln || !fn || !em) { alert('お名前とメールアドレスをご入力ください。'); return; }

      + 'ご利用の目的: ' + (val(f, 'reason') || '-') + '\n';
    window.location.href = 'mailto:' + TO + '?subject=' + encodeURIComponent('【LEAM EC+】お問い合わせ') + '&body=' + encodeURIComponent(body);
  }
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.tagName !== 'FORM') return;
    e.preventDefault(); e.stopPropagation(); send(f);
  }, true);
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[type="submit"]') : null;
    if (!b) return;
    var f = b.closest('form'); if (!f) return;
    e.preventDefault(); e.stopPropagation(); send(f);
  }, true);
})();
